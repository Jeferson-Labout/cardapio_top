.info{margin-top:18px;font-family:var(--cond);font-size:17px;font-weight:500;color:var(--cinza);display:flex;flex-wrap:wrap;gap:4px 18px}

nav{position:sticky;top:0;z-index:5;background:rgba(22,21,20,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
nav ul{list-style:none;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:720px;margin:0 auto;scrollbar-width:none}
nav ul::-webkit-scrollbar{display:none}
nav a{display:block;white-space:nowrap;text-decoration:none;font-family:var(--cond);font-weight:600;font-size:17px;padding:6px 14px;border-radius:999px;border:1px solid var(--linha);color:var(--cinza)}
nav a.ativo{background:var(--brasa);border-color:var(--brasa);color:#1a0d05}
nav a:focus-visible,.info a:focus-visible{outline:2px solid var(--brasa);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:8px 20px 40px}
section{padding-top:34px}
.cab{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;border-bottom:3px solid var(--brasa);padding-bottom:6px;margin-bottom:6px}
h2{font-family:var(--display);font-weight:400;font-size:clamp(44px,12vw,58px);line-height:.9;color:var(--brasa)}
.cols,.precos{display:grid;grid-auto-flow:column;grid-auto-columns:74px;text-align:right}
.cols span{font-family:var(--cond);font-size:14px;font-weight:600;color:var(--cinza)}
.nota{font-size:14px;color:var(--cinza);margin:10px 0 4px;padding-left:10px;border-left:2px solid var(--brasa-escura)}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px dashed var(--linha);align-items:baseline}
.item:last-child{border-bottom:0}
.nome{font-family:var(--cond);font-weight:700;font-size:21px;line-height:1.1}
.desc{font-size:14px;color:var(--cinza);margin-top:3px;max-width:48ch}
.precos span{font-family:var(--cond);font-weight:700;font-size:21px;color:var(--brasa);white-space:nowrap}
.precos .vazio{color:transparent}
.rodape{max-width:720px;margin:0 auto;padding:28px 20px 48px;border-top:1px solid var(--linha);color:var(--cinza);font-size:15px;display:grid;gap:6px}
.rodape strong{color:var(--osso);font-weight:500}
@media (max-width:380px){.cols,.precos{grid-auto-columns:64px}.nome,.precos span{font-size:19px}}
</style>

<script>
/* ============================================================
   CONFIGURAÇÃO
   1) Cole abaixo o link CSV da planilha publicada no Google Sheets
      (Arquivo > Compartilhar > Publicar na web > formato CSV).
   2) Enquanto estiver vazio, o site usa os preços embutidos no fim deste arquivo.
   ============================================================ */
const PLANILHA_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRPGBH8gvnrKQq-4Hg1l6HnhXvyez3jmhP4r4ac1qSgZhoaAkMwVS9FaDfF1M8SRYJei_pZKwNZnATT/pub?gid=1166319248&single=true&output=csv";

/* Colunas de preço e observações de cada categoria (opcional).
   Categorias novas criadas na planilha aparecem automaticamente. */
const CATEGORIAS = {
  "Clássicos":  { cols:["Simples","Completo"], nota:"Completo acompanha arroz, feijão tropeiro ou feijão de caldo, mandioca cozida, vinagrete e alho frito." },
  "Espetão Top":{ nota:"Acompanha arroz branco, feijão tropeiro, paçoca de carne desfiada, vinagrete, feijão de caldo, mandioca cozida, alho frito e manteiga de garrafa." },
  "Bovinos":    { cols:["Simples","Completo"], nota:"Completo acompanha arroz, feijão tropeiro ou feijão de caldo, mandioca cozida, vinagrete e alho frito." },
  "Porções":    { cols:["300 ml","750 ml"] },
  "Caldos":     { nota:"Porção de 350 ml. Acompanha torrada, cheiro-verde e queijo muçarela." },
  "Destilados": { cols:["Dose"] }
};

/* ---------------- daqui pra baixo não precisa mexer ---------------- */
function lerCSV(t){
  const linhas=[];let l=[],c="",aspas=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(aspas){ if(ch==='"'){ if(t[i+1]==='"'){c+='"';i++;} else aspas=false; } else c+=ch; }
    else if(ch==='"') aspas=true;
    else if(ch===','){ l.push(c); c=""; }
    else if(ch==='\n'){ l.push(c); linhas.push(l); l=[]; c=""; }
    else if(ch!=='\r') c+=ch;
  }
  if(c!==""||l.length){ l.push(c); linhas.push(l); }
  return linhas.filter(r=>r.some(x=>x.trim()!==""));
}
const semAcento=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
function numero(v){
  if(!v) return null;
  let s=String(v).replace(/r\$/i,"").replace(/\s/g,"");
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  const n=parseFloat(s); return isNaN(n)?null:n;
}
const real=n=>"R$ "+(Number.isInteger(n)?n:n.toFixed(2).replace(".",","));
const slug=s=>semAcento(s).replace(/[^a-z0-9]+/g,"-");
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function organizar(csv){
  const [cab,...linhas]=lerCSV(csv);
  const idx={}; cab.forEach((h,i)=>idx[semAcento(h)]=i);
  const pega=(r,k)=>(r[idx[k]]||"").trim();
  const grupos=new Map();
  for(const r of linhas){
    const cat=pega(r,"categoria"), nome=pega(r,"item");
    if(!cat||!nome) continue;
    if(["nao","n","0","false"].includes(semAcento(pega(r,"disponivel")))) continue;
    if(!grupos.has(cat)) grupos.set(cat,[]);
    grupos.get(cat).push({nome,desc:pega(r,"descricao"),p1:numero(pega(r,"preco")),p2:numero(pega(r,"preco2"))});
  }
  return grupos;
}

function desenhar(grupos){
  const nav=document.getElementById("nav"), main=document.getElementById("cardapio");
  let n="",m="";
  for(const [cat,itens] of grupos){
    const cfg=CATEGORIAS[cat]||{}, id=slug(cat);
    const duas=itens.some(i=>i.p2!==null);
    n+=`<li><a href="#${id}">${esc(cat)}</a></li>`;
    m+=`<section id="${id}"><div class="cab"><h2>${esc(cat)}</h2>`+
       (cfg.cols?`<div class="cols">${cfg.cols.slice(0,duas?2:1).map(c=>`<span>${esc(c)}</span>`).join("")}</div>`:"")+
       `</div>`+(cfg.nota?`<p class="nota">${esc(cfg.nota)}</p>`:"");
    for(const i of itens){
      m+=`<div class="item"><div><div class="nome">${esc(i.nome)}</div>`+
         (i.desc?`<div class="desc">${esc(i.desc)}</div>`:"")+`</div><div class="precos">`+
         (i.p1!==null?`<span>${real(i.p1)}</span>`:"")+
         (duas?(i.p2!==null?`<span>${real(i.p2)}</span>`:`<span class="vazio">–</span>`):"")+
         `</div></div>`;
    }
    m+=`</section>`;
  }
  nav.innerHTML=n; main.innerHTML=m; marcarAtivo();
}

function marcarAtivo(){
  const nav=document.getElementById("nav");
  const links=[...nav.querySelectorAll("a")];
  const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
    links.forEach(a=>a.classList.toggle("ativo",a.hash==="#"+e.target.id));
    const at=links.find(a=>a.hash==="#"+e.target.id);
    if(at) nav.scrollTo({left:at.offsetLeft-(nav.clientWidth-at.offsetWidth)/2,behavior:"smooth"});
  }})},{rootMargin:"-70px 0px -70% 0px"});
  document.querySelectorAll("main section").forEach(s=>obs.observe(s));
}

const RESERVA=document.getElementById("precos-reserva").textContent.trim();
desenhar(organizar(RESERVA));
if(PLANILHA_CSV_URL){
  fetch(PLANILHA_CSV_URL+(PLANILHA_CSV_URL.includes("?")?"&":"?")+"t="+Date.now())
    .then(r=>{if(!r.ok) throw 0; return r.text();})
    .then(t=>{const g=organizar(t); if(g.size) desenhar(g);})
    .catch(()=>{});
}
</script>
